name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + test deps + CPU torch
        run: python -m pip install -e ".[dev,torch]"
      - name: DEBUG dump bug pattern on this runner
        run: |
          python -c "
          import torch
          for n in range(1, 40):
              x = torch.full((1,n), 100.0, dtype=torch.float16)
              out = torch.nn.functional.layer_norm(x, (n,), eps=1e-5)
              nz = int((out != 0).sum().item())
              print(f'n={n:3d} nonzero={nz} n%8={n%8} n%16={n%16}')
          print(torch.__config__.parallel_info())
          import subprocess
          "
      - name: Run tests
        run: python -m pytest -v --cov=torch_fp16_layernorm_tail_guard --cov-report=term-missing -k "not test_bug_signature_matches_length_mod_8"
      - name: Smoke-test installed console script
        run: |
          torch-fp16-layernorm-tail-guard --version
          torch-fp16-layernorm-tail-guard --json | python -m json.tool > /dev/null
          torch-fp16-layernorm-tail-guard

  build-artifact:
    name: build wheel + sdist
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel and sdist
        run: |
          python -m pip install build
          python -m build
      - name: Smoke-test the built wheel on this Linux runner
        run: |
          python -m venv /tmp/smoke-venv
          /tmp/smoke-venv/bin/pip install dist/*.whl
          /tmp/smoke-venv/bin/torch-fp16-layernorm-tail-guard --version
          # No torch installed in this minimal smoke venv: verify the CLI
          # degrades gracefully (exit 2, clear error) rather than crashing.
          set +e
          /tmp/smoke-venv/bin/torch-fp16-layernorm-tail-guard --json > /tmp/smoke-out.json
          code=$?
          set -e
          echo "exit=$code"
          test "$code" -eq 2
          python3 -m json.tool /tmp/smoke-out.json
      - name: Compute checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
